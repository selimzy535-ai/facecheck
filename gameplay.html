<!DOCTYPE html>
<html>
<head>
<title>Gun Game - Stickman + Sound</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body { margin:0; background:#1a1a2e; overflow:hidden; touch-action:none; }
  canvas { background: linear-gradient(#87CEEB, #2c3e50); display:block; width:100vw; height:100vh; }
  #hud {
    position:absolute; top:10px; left:10px; color:white;
    background:rgba(0,0,0,0.7); padding:10px; border-radius:8px; font-family:Arial; font-size:14px;
  }
  #controls {
    position:absolute; bottom:20px; width:100%; display:flex; justify-content:space-between;
    padding:0 20px; box-sizing:border-box;
  }
  button {
    padding:18px 25px; font-size:20px; border:none; border-radius:12px;
    background:#e94560; color:white; font-weight:bold;
    box-shadow:0 4px 8px rgba(0,0,0,0.3);
  }
  button:active { transform:scale(0.95); }
</style>
</head>
<body>
<div id="hud">
  HP: <span id="hp">100</span> |
  Score: <span id="score">0</span> |
  Bullets: <span id="bullets">200</span> |
  Time: <span id="timer">180</span>s
</div>

<canvas id="gameCanvas"></canvas>

<div id="controls">
  <div>
    <button id="left">◀</button>
    <button id="right">▶</button>
    <button id="jump">⬆</button>
  </div>
  <button id="shoot">FIRE</button>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const socket = io('https://your-backend.onrender.com');

let me = { x:100, y:canvas.height-80, vx:0, vy:0, hp:100, score:0, gunId:'pistol', facing:1, bullets:200 };
let players = {};
let keys = {};
let roomId = 'free-1';
let userId = localStorage.getItem('userId') || 'player'+Math.floor(Math.random()*10000);
let gunId = localStorage.getItem('gunId') || 'pistol';

// ====== WEB AUDIO API - PISTOL ======
let audioCtx;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playPistolSound() {
  if (!audioCtx) return;

  const bufferSize = audioCtx.sampleRate * 0.25;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1; // white noise
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(2500, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();
  noise.stop(audioCtx.currentTime + 0.25);
}

// Socket connection
socket.emit('joinRoom', { roomId, userId, gunId });

socket.on('roomUpdate', (room) => {
  players = {};
  room.players.forEach(p => {
    players[p.userId] = {...p, x:100, y:canvas.height-80, facing:1, bullets:200 };
  });
});

socket.on('hpUpdate', ({ userId: uid, hp }) => {
  if (players[uid]) {
    if (hp < players[uid].hp) playPistolSound(); // play sound when hit
    players[uid].hp = hp;
    if (uid === userId) document.getElementById('hp').innerText = hp;
  }
});

socket.on('timer', (time) => document.getElementById('timer').innerText = time);

// Controls
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

document.getElementById('left').ontouchstart = () => { keys['a'] = true; initAudio(); }
document.getElementById('right').ontouchstart = () => { keys['d'] = true; initAudio(); }
document.getElementById('jump').ontouchstart = () => { keys['w'] = true; initAudio(); }
document.getElementById('shoot').ontouchstart = () => { shoot(); initAudio(); }

// Platforms
const platforms = [
  { x:canvas.width*0.2, y:canvas.height-150, w:200, h:20 },
  { x:canvas.width*0.6, y:canvas.height-250, w:200, h:20 },
  { x:canvas.width*0.85, y:canvas.height-100, w:150, h:20 }
];

function shoot() {
  let target = Object.values(players).find(p => p.userId!== userId && p.hp > 0);
  if (target && me.bullets > 0) {
    me.bullets--;
    document.getElementById('bullets').innerText = me.bullets;
    playPistolSound();
    socket.emit('shoot', { roomId, targetId: target.userId });
  }
}

// ====== STICKMAN DRAW ======
function drawStickman(x, y, color, facing, gunId) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(facing, 1);

  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';

  // Head
  ctx.beginPath();
  ctx.arc(0, -30, 12, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(0, 18);
  ctx.stroke();

  // Arms + Gun
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.lineTo(18, -8);
  ctx.stroke();

  ctx.strokeStyle = '#222';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(18, -8);
  ctx.lineTo(32, -8);
  ctx.stroke();

  // Legs
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 18);
  ctx.lineTo(-10, 32);
  ctx.moveTo(0, 18);
  ctx.lineTo(10, 32);
  ctx.stroke();

  ctx.restore();
}

function update() {
  if (keys['a']) { me.vx = -5; me.facing = -1; }
  else if (keys['d']) { me.vx = 5; me.facing = 1; }
  else me.vx *= 0.85;

  if (keys['w'] && me.onGround) { me.vy = -12; me.onGround = false; }
  me.vy += 0.6;

  me.x += me.vx;
  me.y += me.vy;

  // Platform collision
  me.onGround = false;
  platforms.forEach(p => {
    if (me.x + 15 > p.x && me.x - 15 < p.x + p.w && me.y + 32 > p.y && me.y < p.y) {
      me.y = p.y - 32;
      me.vy = 0;
      me.onGround = true;
    }
  });

  if (me.y > canvas.height-80) { me.y = canvas.height-80; me.vy = 0; me.onGround = true; }
  if (me.x < 0) me.x = 0;
  if (me.x > canvas.width) me.x = canvas.width;

  me.userId = userId;
  players[userId] = me;
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Platforms
  ctx.fillStyle = '#34495e';
  platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

  // Players
  Object.values(players).forEach(p => {
    if (p.hp <= 0) return;
    let color = p.userId === userId? '#00ff88' : '#ff4757';
    drawStickman(p.x, p.y, color, p.facing || 1, p.gunId);

    // Name + HP bar
    ctx.fillStyle = 'white';
    ctx.font = '14px Arial';
    ctx.fillText(p.userId.slice(0,4), p.x - 20, p.y - 50);

    ctx.fillStyle = 'red';
    ctx.fillRect(p.x - 20, p.y - 45, 40, 5);
    ctx.fillStyle = 'lime';
    ctx.fillRect(p.x - 20, p.y - 45, (p.hp || 100) * 0.4, 5);
  });

  requestAnimationFrame(gameLoop);
}

function gameLoop() {
  update();
  draw();
}
gameLoop();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
