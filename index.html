// --- Audio Engine ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playShotSound(gunType) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  let duration = 0.1; let frequency = 400; let volume = 0.4;
  if(gunType === 1) { duration = 0.06; frequency = 600; volume = 0.25; } 
  else if(gunType === 2) { duration = 0.25; frequency = 180; volume = 0.6; }

  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
  
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(frequency, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + (duration * 0.9));
  
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

function playDeathSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const time = audioCtx.currentTime;
  const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter();
  osc1.type = 'sawtooth'; osc2.type = 'triangle';
  osc1.frequency.setValueAtTime(130, time); osc1.frequency.exponentialRampToValueAtTime(65, time + 0.22);
  osc2.frequency.setValueAtTime(133, time); osc2.frequency.exponentialRampToValueAtTime(67, time + 0.22);
  filter.type = 'lowpass'; filter.frequency.setValueAtTime(350, time); filter.frequency.exponentialRampToValueAtTime(110, time + 0.2);
  gainNode.gain.setValueAtTime(0.5, time); gainNode.gain.linearRampToValueAtTime(0.3, time + 0.08); gainNode.gain.linearRampToValueAtTime(0.01, time + 0.24);
  osc1.connect(filter); osc2.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
  osc1.start(time); osc2.start(time); osc1.stop(time + 0.25); osc2.stop(time + 0.25);
}

// --- Joysticks ---
const movePad = document.getElementById('movePad');
const moveStick = document.getElementById('moveStick');
let moveActive = false;
const moveCenterX = 47.5, moveCenterY = 47.5, moveMaxDist = 35;

function updateMove(e) {
  const rect = movePad.getBoundingClientRect();
  let clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let clientY = e.touches ? e.touches[0].clientY : e.clientY;
  if (e.touches && e.touches.length > 1) {
    for (let i=0; i<e.touches.length; i++) {
      let tRect = movePad.getBoundingClientRect();
      if (e.touches[i].clientX >= tRect.left && e.touches[i].clientX <= tRect.right) {
        clientX = e.touches[i].clientX; clientY = e.touches[i].clientY;
      }
    }
  }
  let dx = (clientX - rect.left) - moveCenterX;
  let dy = (clientY - rect.top) - moveCenterY;
  let dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > moveMaxDist) { dx = (dx / dist) * moveMaxDist; dy = (dy / dist) * moveMaxDist; }
  moveStick.style.left = (moveCenterX + dx - 19) + 'px';
  moveStick.style.top = (moveCenterY + dy - 19) + 'px';
  gameState.moveX = dx / moveMaxDist; gameState.moveY = dy / moveMaxDist;
}
movePad.addEventListener('touchstart', e => { e.preventDefault(); moveActive = true; updateMove(e); });
movePad.addEventListener('touchmove', e => { e.preventDefault(); if (moveActive) updateMove(e); });
movePad.addEventListener('touchend', e => { 
  e.preventDefault(); moveActive = false; moveStick.style.left = '28.5px'; moveStick.style.top = '28.5px'; gameState.moveX = 0; gameState.moveY = 0; 
});

        clientX = e.touches[i].clientX; clientY = e.touches[i].clientY;
      }
    }
  }
  let dx = (clientX - rect.left) - aimCenterX;
  let dy = (clientY - rect.top) - aimCenterY;
  let dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > aimMaxDist) { dx = (dx / dist) * aimMaxDist; dy = (dy / dist) * aimMaxDist; }

  aimCenter.style.top = (aimCenterY + dy - 19) + 'px';

  if (Math.abs(gameState.aimX) > 0.1) gameState.player.facing = gameState.aimX >= 0 ? 1 : -1;
}

});
aimOuter.addEventListener('touchmove', e => { e.preventDefault(); if (aimActive) updateAim(e); });
aimOuter.addEventListener('touchend', e => { 
  e.preventDefault(); aimActive = false; aimCenter.style.left = '28.5px'; aimCenter.style.top = '28.5px'; gameState.aimX = 0; gameState.aimY = 0; 
  clearInterval(shootInterval); shootInterval = null;
});

function shoot() {
  if (gameState.gameOver) return;
  const p = gameState.player;
  if (gameState.aimX === 0 && gameState.aimY === 0) return;
  let angle = Math.atan2(gameState.aimY, gameState.aimX);
  
  const currentGun = weapons[activeGunIdx];
  playShotSound(activeGunIdx);
  
  gameState.bullets.push({ 
    x: p.x + 16 + Math.cos(angle)*15, y: p.y + 22 + Math.sin(angle)*15, 
    vx: Math.cos(angle) * currentGun.speed, vy: Math.sin(angle) * currentGun.speed, 
    r: activeGunIdx === 2 ? 4 : 3, life: Math.round(currentGun.range / currentGun.speed),
    damage: currentGun.damage, enemy: false 
  });
  
  for(let i = 0; i < 2; i++) {
    gameState.particles.push({ x: p.x + 16 + Math.cos(angle)*15, y: p.y + 22 + Math.sin(angle)*15, vx: Math.cos(angle) * 4 + (Math.random()-0.5)*2, vy: Math.sin(angle) * 4 + (Math.random()-0.5)*2, life: 6, r: 2, color: currentGun.color });
  }
}

function spawnEnemy() {
  const p = gameState.player;
  let spawnX = Math.random() > 0.5 ? p.x + (viewW/2 + 150 + Math.random()*250) : p.x - (viewW/2 + 150 + Math.random()*250);
  if (spawnX < 40) spawnX = 40 + Math.random()*150;
  if (spawnX > MAP_W - 40) spawnX = MAP_W - 40 - Math.random()*150;

  const randomName = humanNames[Math.floor(Math.random() * humanNames.length)];
  const weaponType = Math.floor(Math.random() * 3);
  
  gameState.enemies.push({
    name: randomName,
    gunIdx: weaponType,
    x: spawnX,
    y: FLOOR_Y - 150 - Math.random()*200, 
    w: 34, h: 52,
    vx: 0, vy: 0,
    health: 100,
    facing: 1,
    fuel: 100,
    shootCooldown: 50 + Math.random()*50,
    actionTimer: 0,
    targetMoveX: 0,
    isJetpacking: false
  });
}

function updatePlayer() {
  const p = gameState.player;
  if (Math.abs(gameState.moveX) > 0.15) {
    p.vx = gameState.moveX * p.speed;
    if (Math.abs(gameState.aimX) <= 0.1) p.facing = p.vx >= 0 ? 1 : -1;
  } else { p.vx *= 0.75; }

  p.jetpacking = false;
  if (gameState.moveY < -0.35) {
    if (p.onGround) { p.vy = -p.jumpPower; p.onGround = false; }
    else if (p.fuel > 0) {
      p.vy -= JETPACK_THRUST; p.fuel -= JETPACK_DRAIN; p.jetpacking = true;
      if (Math.random() > 0.2) {
        gameState.particles.push({ x: p.x + 16 + (Math.random()-0.5)*6, y: p.y + p.h, vx: p.vx * 0.4 + (Math.random()-0.5)*2, vy: 3 + Math.random()*2, life: 12, r: 2 + Math.random()*2, color: '#ff6600' });
      }
    }
  }
  if (p.onGround && p.fuel < JETPACK_FUEL_MAX) p.fuel = Math.min(JETPACK_FUEL_MAX, p.fuel + JETPACK_RECHARGE);

  p.vy += GRAVITY; p.x += p.vx; p.y += p.vy; p.onGround = false;
  for (let plat of gameState.platforms) {
    if (p.x + p.w > plat.x && p.x < plat.x + plat.w && p.y + p.h > plat.y && p.y + p.h - p.vy <= plat.y) {
      p.y = plat.y - p.h; p.vy = 0; p.onGround = true;
    }
  }
  if (p.x < 0) p.x = 0; if (p.x + p.w > MAP_W) p.x = MAP_W - p.w; if (p.y < 0) { p.y = 0; p.vy = 0; }

  camera.x = p.x - viewW / 2; camera.y = p.y - viewH / 2;
  if (camera.x < 0) camera.x = 0; if (camera.x > MAP_W - viewW) camera.x = MAP_W - viewW;
  if (camera.y < 0) camera.y = 0; if (camera.y > MAP_H - viewH) camera.y = MAP_H - viewH;
}

function updateBullets() {
  gameState.bullets = gameState.bullets.filter(b => {
    b.x += b.vx; b.y += b.vy; b.life--;
    for (let i = gameState.enemies.length - 1; i >= 0; i--) {
      const e = gameState.enemies[i];
      if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h && !b.enemy) {
        e.health -= b.damage || 20;
        for(let j = 0; j < 5; j++) gameState.particles.push({ x: b.x, y: b.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, life: 10, r: 2, color: '#e94556' });
        if (e.health <= 0) { 
          playDeathSound();
          gameState.enemies.splice(i, 1); gameState.score += 1; 
        }
        return false;
      }
    }
    return b.life > 0 && b.x > 0 && b.x < MAP_W && b.y > 0 && b.y < MAP_H;
  });
}

function updateEnemies() {
  const p = gameState.player;
  
  gameState.enemies.forEach(e => {
    e.actionTimer--;
    if (e.actionTimer <= 0) {
      e.actionTimer = 40 + Math.random() * 60;
      e.targetMoveX = e.x < p.x ? (Math.random() > 0.25 ? 1 : -1) : (Math.random() > 0.25 ? -1 : 1);
      e.isJetpacking = Math.random() > 0.5 && e.y > MAP_H - 400;
    }

    // --- Tweaked Speed Mechanics: Enemies are now slightly slower (2.2 instead of 4.2) ---
    e.vx = e.targetMoveX * 2.2;
    e.facing = p.x > e.x ? 1 : -1;

    if (e.isJetpacking && e.fuel > 0) {
      e.vy -= JETPACK_THRUST * 0.95; e.fuel -= 0.8;
      if (Math.random() > 0.4) {
        gameState.particles.push({ x: e.x + 16, y: e.y + e.h, vx: (Math.random()-0.5)*2, vy: 2 + Math.random()*2, life: 10, r: 2, color: '#ffcc00' });
      }
    } else { e.fuel = Math.min(100, e.fuel + 0.35); }

    e.vy += GRAVITY; e.x += e.vx; e.y += e.vy;

    for (let plat of gameState.platforms) {
      if (e.x + e.w > plat.x && e.x < plat.x + plat.w && e.y + e.h > plat.y && e.y + e.h - e.vy <= plat.y) {
        e.y = plat.y - e.h; e.vy = 0;
      }
    }
    if (e.x < 0) e.x = 0; if (e.x + e.w > MAP_W) e.x = MAP_W - e.w;

    e.shootCooldown--;
    let currentGun = weapons[e.gunIdx];
    if (e.shootCooldown <= 0 && Math.abs(e.x - p.x) < currentGun.range) {
      const angle = Math.atan2(p.y + 20 - (e.y + 24), p.x + 16 - (e.x + 16)) + (Math.random() - 0.5) * 0.2; 
      playShotSound(e.gunIdx);
      gameState.bullets.push({ 
        x: e.x + 16 + Math.cos(angle)*15, y: e.y + 24 + Math.sin(angle)*15, 
        vx: Math.cos(angle) * currentGun.speed, vy: Math.sin(angle) * currentGun.speed, 
        r: 3, life: Math.round(currentGun.range / currentGun.speed), enemy: true 
      });
      e.shootCooldown = currentGun.fireRate / 2 + 40 + Math.random()*40;
    }
  });

  gameState.bullets.forEach(b => {
    if (b.enemy && b.x > p.x && b.x < p.x + p.w && b.y > p.y && b.y < p.y + p.h) {
      p.health -= 5; b.life = 0;
      if (p.health <= 0) endGame();
    }
  });
}

function updateParticles() { gameState.particles = gameState.particles.filter(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.life--; return pt.life > 0; }); }

function drawRadar() {
  radarCtx.fillStyle = 'rgba(10, 24, 10, 0.9)';
  radarCtx.fillRect(0, 0, 180, 60);

  const scaleX = 180 / MAP_W;
  const scaleY = 60 / MAP_H;

  radarCtx.fillStyle = '#4a5e3a';
  gameState.platforms.forEach(p => {
    radarCtx.fillRect(p.x * scaleX, p.y * scaleY, p.w * scaleX, p.h * scaleY);
  });

  // Player radar blip
  radarCtx.fillStyle = '#00ffcc';
  radarCtx.beginPath();
  radarCtx.arc(gameState.player.x * scaleX, gameState.player.y * scaleY, 3, 0, Math.PI * 2);
  radarCtx.fill();

  // Real human enemies radar blips
  radarCtx.fillStyle = '#ff2233';
  gameState.enemies.forEach(e => {
    radarCtx.beginPath();
    radarCtx.arc(e.x * scaleX, e.y * scaleY, 2.5, 0, Math.PI * 2);
    radarCtx.fill();
  });
}

function draw() {
  ctx.clearRect(0,0,viewW,viewH);
  const theme = mapThemes[activeMapIdx];

  const gradient = ctx.createLinearGradient(0, 0, 0, viewH);
  gradient.addColorStop(0, theme.skyTop); gradient.addColorStop(1, theme.skyBottom);
  ctx.fillStyle = gradient; ctx.fillRect(0, 0, viewW, viewH);

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  theme.mountains.forEach((mnt, mIdx) => {
    ctx.fillStyle = mnt.color; ctx.beginPath(); ctx.moveTo(0, MAP_H);
    let stepsArr = mIdx === 0 ? mountainSteps1 : mountainSteps2;
    for (let i = 0; i < stepsArr.length; i++) {
      let x = stepsArr[i]; let y = mnt.base - (i % 2 === 0 ? mnt.peak : mnt.peak * 0.4) - (Math.sin(i)*15);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(MAP_W, MAP_H); ctx.fill();
  });

  ctx.fillStyle = theme.canopy;
  for (let i = 0; i < MAP_W; i += 120) {
    ctx.beginPath(); ctx.arc(i, FLOOR_Y - 10, 60, 0, Math.PI, true); ctx.fill();
  }

  gameState.platforms.forEach(p => {
    ctx.fillStyle = theme.ground; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = theme.grass; ctx.fillRect(p.x, p.y, p.w, 6);
  });
  gameState.bunkers.forEach(b => { ctx.drawImage(bunkerImg, b.x, b.y, b.w, b.h); });

  if (gameState.player.jetpacking) {
    ctx.fillStyle = '#ff4500'; ctx.beginPath();
    ctx.moveTo(gameState.player.x + (gameState.player.facing > 0 ? 4 : 28), gameState.player.y + 36);
    ctx.lineTo(gameState.player.x + (gameState.player.facing > 0 ? -4 : 36), gameState.player.y + 54);
    ctx.lineTo(gameState.player.x + (gameState.player.facing > 0 ? 12 : 20), gameState.player.y + 40);
    ctx.fill();
  }

  // Draw Player Avatar
  ctx.save();
  if (gameState.player.facing < 0) {
    ctx.translate(gameState.player.x + gameState.player.w, gameState.player.y); ctx.scale(-1, 1);
    ctx.drawImage(playerImg, 0, 0, gameState.player.w, gameState.player.h);
  } else {
    ctx.drawImage(playerImg, gameState.player.x, gameState.player.y, gameState.player.w, gameState.player.h);
  }
  ctx.restore();

  // Draw Gun
  ctx.save();
  ctx.translate(gameState.player.x + 18, gameState.player.y + 32);
  let gunAngle = (gameState.aimX === 0 && gameState.aimY === 0) ? (gameState.player.facing > 0 ? 0 : Math.PI) : Math.atan2(gameState.aimY, gameState.aimX);
  if (gameState.player.facing < 0) { ctx.scale(1, -1); ctx.rotate(-gunAngle + Math.PI); } else { ctx.rotate(gunAngle); }
  ctx.drawImage(rifleImg, -5, -4, activeGunIdx === 2 ? 34 : 28, 10);
  ctx.restore();

  // Laser Pointer Reticle
  if (Math.abs(gameState.aimX) > 0.05 || Math.abs(gameState.aimY) > 0.05) {
    ctx.strokeStyle = activeGunIdx === 2 ? 'rgba(255, 30, 30, 0.75)' : 'rgba(0, 255, 200, 0.4)'; 
    ctx.lineWidth = activeGunIdx === 2 ? 1.5 : 1; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(gameState.player.x + 18, gameState.player.y + 32);
    let angle = Math.atan2(gameState.aimY, gameState.aimX);
    ctx.lineTo(gameState.player.x + 18 + Math.cos(angle) * weapons[activeGunIdx].range, gameState.player.y + 32 + Math.sin(angle) * weapons[activeGunIdx].range);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Draw Real Human Enemies with full details
  gameState.enemies.forEach(e => {
    ctx.save();
    if (e.facing < 0) {
      ctx.translate(e.x + e.w, e.y); ctx.scale(-1, 1);
      ctx.drawImage(humanEnemyImg, 0, 0, e.w, e.h);
    } else {
      ctx.drawImage(humanEnemyImg, e.x, e.y, e.w, e.h);
    }
    ctx.restore();

    // Player name labels
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.textShadow = '1px 1px 2px #000';
    ctx.fillText(e.name, e.x + e.w/2, e.y - 16);

    // Health UI
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - 4, e.y - 8, e.w + 8, 3.5);
    ctx.fillStyle = '#00ffcc'; ctx.fillRect(e.x - 4, e.y - 8, (e.w + 8) * (e.health/100), 3.5);
  });

  gameState.bullets.forEach(b => { ctx.fillStyle = b.enemy ? '#ff3333' : weapons[activeGunIdx].color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); });
  gameState.particles.forEach(pt => { ctx.fillStyle = pt.color; ctx.globalAlpha = Math.max(0, pt.life / 15); ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; });

  ctx.restore();

  document.getElementById('healthBarFill').style.width = Math.max(0, gameState.player.health) + '%';
  document.getElementById('fuelFill').style.width = (gameState.player.fuel / JETPACK_FUEL_MAX * 100) + '%';
  document.getElementById('score').textContent = gameState.score;

  drawRadar();
}

let enemySpawnTimer = 0;
function gameLoop() {
  if (!gameState.gameOver) {
    updatePlayer(); updateBullets(); updateEnemies(); updateParticles();
    enemySpawnTimer--;
    if (enemySpawnTimer <= 0) { spawnEnemy(); enemySpawnTimer = 140 - Math.min(gameState.score * 3, 60); }
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameState.gameOver = true;
  document.getElementById('finalScore').textContent = gameState.score;
  document.getElementById('gameOver').style.display = 'block';
  if(shootInterval) { clearInterval(shootInterval); shootInterval = null; }
}

function restartGame() {
  gameState.player = { x: 400, y: FLOOR_Y - 60, w: 34, h: 52, vx: 0, vy: 0, speed: 5.0, jumpPower: 9.5, onGround: false, health: 100, facing: 1, fuel: JETPACK_FUEL_MAX, jetpacking: false };
  gameState.bullets = []; gameState.enemies = []; gameState.particles = []; gameState.score = 0; gameState.moveX = 0; gameState.moveY = 0; gameState.aimX = 0; gameState.aimY = 0; gameState.gameOver = false;
  document.getElementById('gameOver').style.display = 'none';
  enemySpawnTimer = 20;
}

enemySpawnTimer = 20;
gameLoop();
</script>
