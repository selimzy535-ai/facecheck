<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Video Shrinker</title>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-center">Video Compressor</h1>
        
        <input type="file" id="uploader" accept="video/*" class="block w-full text-sm text-gray-400 mb-6 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-500" />
        
        <button id="compress-btn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition-all transform active:scale-95">
            Compress Video
        </button>

        <div id="status" class="mt-4 text-center text-sm text-gray-400">Ready</div>
        
        <div class="mt-6">
            <video id="output-video" controls class="w-full rounded-lg hidden"></video>
        </div>
    </div>

    <script type="module">
        import { FFmpeg } from 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
        import { toBlobURL, fetchFile } from 'https://unpkg.com/@ffmpeg/util@0.12.1/dist/esm/index.js';

        const ffmpeg = new FFmpeg();
        const status = document.getElementById('status');
        const btn = document.getElementById('compress-btn');
        const video = document.getElementById('output-video');
        const uploader = document.getElementById('uploader');

        async function init() {
            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
            await ffmpeg.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
            });
        }

        btn.onclick = async () => {
            if (!uploader.files[0]) return alert("Please select a video");
            
            btn.disabled = true;
            status.innerText = "Initializing engine...";
            await init();

            const file = uploader.files[0];
            const name = 'input.mp4';
            
            await ffmpeg.writeFile(name, await fetchFile(file));
            
            status.innerText = "Compressing... (this takes a moment)";
            
            // Stronger & Faster command
            await ffmpeg.exec([
                '-i', name,
                '-vcodec', 'libx264',
                '-crf', '28',        // High compression
                '-preset', 'ultrafast', // Speed optimization
                '-tune', 'zerolatency', // Improves responsiveness
                'output.mp4'
            ]);
            
            const data = await ffmpeg.readFile('output.mp4');
            video.src = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            video.classList.remove('hidden');
            status.innerText = "Compression Complete!";
            btn.disabled = false;
        };
    </script>
</body>
</html>
