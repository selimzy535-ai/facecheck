<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gun Game - Signup & Verify</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  color:white;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}
.box {
  background:#0f3460;
  padding:30px 25px;
  border-radius:15px;
  width:100%;
  max-width:400px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
h1 { text-align:center; margin-bottom:20px; color:#e94560; }
h2 { text-align:center; margin-bottom:15px; font-size:18px; }
input, button {
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  font-size:16px;
}
input { background:#16213e; color:white; outline:none; }
input:focus { border:2px solid #e94560; }
button {
  background:#e94560;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}
button:active { transform:scale(0.97); }
button:disabled { background:#555; cursor:not-allowed; }
.code-box {
  font-size:36px;
  letter-spacing:8px;
  background:#16213e;
  padding:20px;
  margin:15px 0;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
  color:#00ff88;
}
.hidden { display:none; }
.msg { text-align:center; margin-top:10px; font-size:14px; min-height:20px; }
.success { color:#00ff88; }
.error { color:#ff4757; }
.tab-btns { display:flex; gap:10px; margin-bottom:20px; }
.tab-btn { flex:1; background:#16213e; }
.tab-btn.active { background:#e94560; }
.small { font-size:12px; color:#aaa; text-align:center; margin-top:15px; }
</style>
</head>
<body>

<div class="box">
  <h1>🔫 GUN GAME</h1>

  <div class="tab-btns">
    <button class="tab-btn active" onclick="showTab('signup')">Signup</button>
    <button class="tab-btn" onclick="showTab('login')">Login</button>
  </div>

  <!-- SIGNUP TAB -->
  <div id="signupTab">
    <input type="text" id="suUsername" placeholder="Choose Username" autocomplete="username">
    <input type="password" id="suPassword" placeholder="Create Password" autocomplete="new-password">
    <button onclick="signup()">Create Account</button>
    <div class="msg" id="suMsg"></div>
  </div>

  <!-- LOGIN TAB -->
  <div id="loginTab" class="hidden">
    <input type="text" id="liUsername" placeholder="Username" autocomplete="username">
    <input type="password" id="liPassword" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Login</button>
    <div class="msg" id="liMsg"></div>
  </div>

  <!-- VERIFY TAB -->
  <div id="verifyTab" class="hidden">
    <h2>Verify Your Account</h2>
    <p style="text-align:center; font-size:13px; color:#aaa;">Click "Get Code" then enter same code below</p>

    <button id="genBtn" onclick="generateCode()">Get Code</button>

    <div id="codeArea" class="hidden">
      <p style="text-align:center">Your Code:</p>
      <div class="code-box" id="codeDisplay">000</div>

      <input type="text" id="userCode" placeholder="Enter Code" maxlength="6" inputmode="numeric">
      <button onclick="verifyCode()">Verify & Continue</button>
    </div>

    <div class="msg" id="vMsg"></div>
  </div>

  <p class="small">After verify → Unlock pistol by watching 3 ads</p>
</div>

<script>
const API = 'http://localhost:3000/api'; // change to your server URL
let currentToken = '';

function showTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('signupTab').classList.add('hidden');
  document.getElementById('loginTab').classList.add('hidden');

  if (tab === 'signup') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('signupTab').classList.remove('hidden');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('loginTab').classList.remove('hidden');
  }
}

// ===== SIGNUP =====
async function signup() {
  const username = document.getElementById('suUsername').value.trim();
  const password = document.getElementById('suPassword').value;
  const msg = document.getElementById('suMsg');

  if (!username ||!password) {
    msg.innerText = 'Fill all fields';
    msg.className = 'msg error';
    return;
  }

  msg.innerText = 'Creating account...';
  msg.className = 'msg';

  try {
    const res = await fetch(`${API}/signup`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.msg || 'Signup failed');

    // Save token
    localStorage.setItem('token', data.token);
    localStorage.setItem('userId', data.userId);

    msg.innerText = 'Account created! Now verify';
    msg.className = 'msg success';

    setTimeout(() => showVerify(), 1000);

  } catch (e) {
    msg.innerText = e.message;
    msg.className = 'msg error';
  }
}

// ===== LOGIN =====
async function login() {
  const username = document.getElementById('liUsername').value.trim();
  const password = document.getElementById('liPassword').value;
  const msg = document.getElementById('liMsg');

  if (!username ||!password) {
    msg.innerText = 'Fill all fields';
    msg.className = 'msg error';
    return;
  }

  msg.innerText = 'Logging in...';
  msg.className = 'msg';

  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.msg || 'Login failed');

    localStorage.setItem('token', data.token);
    localStorage.setItem('userId', data.userId);

    // Check if verified
    if (data.verified) {
      window.location = 'unlock.html';
    } else {
      showVerify();
    }

  } catch (e) {
    msg.innerText = e.message;
    msg.className = 'msg error';
  }
}

// ===== SHOW VERIFY SECTION =====
function showVerify() {
  document.getElementById('signupTab').classList.add('hidden');
  document.getElementById('loginTab').classList.add('hidden');
  document.getElementById('verifyTab').classList.remove('hidden');
}

// ===== GENERATE BROWSER TOKEN =====
async function generateCode() {
  const code = Math.floor(100000 + Math.random() * 900000).toString();
  currentToken = code;

  document.getElementById('codeDisplay').innerText = code;
  document.getElementById('codeArea').classList.remove('hidden');
  document.getElementById('genBtn').disabled = true;
  document.getElementById('vMsg').innerText = 'Code expires in 10 minutes';
  document.getElementById('vMsg').className = 'msg success';

  // Send token to backend
  const token = localStorage.getItem('token');
  await fetch(`${API}/set-verify-token`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ token: code })
  });

  // Auto expire after 10min
  setTimeout(() => {
    currentToken = '';
    document.getElementById('genBtn').disabled = false;
    document.getElementById('vMsg').innerText = 'Code expired. Click Get Code again';
    document.getElementById('vMsg').className = 'msg error';
  }, 600000);
}

// ===== VERIFY CODE =====
async function verifyCode() {
  const input = document.getElementById('userCode').value.trim();
  const msg = document.getElementById('vMsg');
  const token = localStorage.getItem('token');

  if (input!== currentToken) {
    msg.innerText = 'Wrong code. Try again';
    msg.className = 'msg error';
    return;
  }

  msg.innerText = 'Verifying...';
  msg.className = 'msg';

  try {
    const res = await fetch(`${API}/verify-token`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ token: input })
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.msg);

    msg.innerText = '✅ Verified! Redirecting...';
    msg.className = 'msg success';

    setTimeout(() => {
      window.location = 'unlock.html';
    }, 1500);

  } catch (e) {
    msg.innerText = e.message;
    msg.className = 'msg error';
  }
}

// ===== AUTO LOGIN IF TOKEN EXISTS =====
window.onload = () => {
  const token = localStorage.getItem('token');
  if (token) {
    // Check if user already verified
    fetch(`${API}/me`, {
      headers: {'Authorization': 'Bearer ' + token}
    })
   .then(r => r.json())
   .then(data => {
      if (data.verified) {
        window.location = 'unlock.html';
      } else {
        showVerify();
      }
    })
   .catch(() => {
      localStorage.clear();
    });
  }
};
</script>
</body>
</html>
