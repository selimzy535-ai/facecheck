
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biometric Liveness & ID OCR Scan</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">

<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root {
  --bg-color: #0f172a;
  --card-bg: #1e293b;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --success: #10b981;
  --danger: #ef4444;
  --text: #f8fafc;
  --text-muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { background-color: var(--card-bg); width: 100%; max-width: 480px; padding: 25px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
h2 { font-size: 22px; font-weight: 600; margin-bottom: 6px; text-align: center; }
.subtitle { color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #cbd5e1; }
input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 14px; outline: none; }
input:focus { border-color: var(--primary); }

.scanner-wrapper { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; border: 2px solid #334155; }
video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* Mirrored for face scan */ }
video.unmirrored { transform: scaleX(1); /* Un-mirrored for ID text reading */ }

.overlay-box { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; pointer-events: none; }
.status-badge { align-self: center; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(4px); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid #475569; }
.status-badge.loading { color: #f59e0b; border-color: #f59e0b; }
.status-badge.ready { color: var(--primary); border-color: var(--primary); }
.status-badge.success { color: var(--success); border-color: var(--success); }
.status-badge.error { color: var(--danger); border-color: var(--danger); }

.step-card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); padding: 12px; border-radius: 8px; border-left: 4px solid var(--primary); }
.step-title { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.8px; }
.step-instruction { font-size: 14px; font-weight: 600; color: #fff; margin-top: 2px; }

.btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; background-color: var(--primary); color: white; margin-top: 6px; }
.btn:hover:not(:disabled) { background-color: var(--primary-hover); }
.btn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
.btn-submit { background-color: var(--success); display: none; }

canvas { display: none; /* Hidden frame capture buffer */ }
</style>
</head>
<body>

<div class="container">
  <h2>Account Verification</h2>
  <p class="subtitle">Complete liveness & document scan to register</p>
  
  <form id="verifyForm" onsubmit="handleFormSubmit(event)">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="name@example.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" required>
    </div>

    <label>Live Camera Terminal</label>
    <div class="scanner-wrapper">
      <video id="webcam" autoplay muted playsinline></video>
      <div class="overlay-box">
        <div id="badge" class="status-badge loading">Loading AI Engines...</div>
        <div id="stepCard" class="step-card">
          <div id="stepTitle" class="step-title">Step 1: Face Liveness</div>
          <div id="instruction" class="step-instruction">Initializing...</div>
        </div>
      </div>
    </div>

    <button type="button" id="startBtn" class="btn" onclick="startLivenessPhase()" disabled>Start Liveness Scan</button>
    <button type="button" id="captureIdBtn" class="btn" onclick="captureAndScanID()" style="display:none;">📷 Capture ID Card Frame</button>
    <button type="submit" id="submitBtn" class="btn btn-submit">✓ Submit Registration Payload</button>
  </form>
</div>

<canvas id="snapshotCanvas"></canvas>

<script>
const video = document.getElementById('webcam');
const badge = document.getElementById('badge');
const stepTitle = document.getElementById('stepTitle');
const instruction = document.getElementById('instruction');
const startBtn = document.getElementById('startBtn');
const captureIdBtn = document.getElementById('captureIdBtn');
const submitBtn = document.getElementById('submitBtn');
const snapshotCanvas = document.getElementById('snapshotCanvas');

let detectorOptions;
let modelsLoaded = false;
let trackingLoopId = null;
let currentPhase = 'IDLE'; // 'FACE_LIVENESS' | 'ID_SCAN' | 'COMPLETE'

// Biometric & OCR Payload Container
const verificationPayload = {
  liveFaceDescriptor: null,
  hashedIDNumber: null
};

// 1. Initialize Face-API Models
async function initVerificationEngine() {
  try {
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);

    detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.4 });
    modelsLoaded = true;
    
    badge.innerText = "Connecting Webcam...";
    badge.className = "status-badge ready";
    await startCameraStream();
  } catch (err) {
    badge.innerText = "Error Loading AI Engines";
    badge.className = "status-badge error";
    console.error(err);
  }
}

// 2. Start Camera Stream
async function startCameraStream() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    startBtn.disabled = false;
    badge.innerText = "Ready";
    instruction.innerText = "Press Start Liveness Scan when ready";
  } catch (err) {
    badge.innerText = "Camera Permission Denied";
    badge.className = "status-badge error";
  }
}

// 3. PHASE 1: Liveness Verification Loop
function startLivenessPhase() {
  if (!modelsLoaded) return;
  currentPhase = 'FACE_LIVENESS';
  startBtn.style.display = "none";
  badge.innerText = "Performing Liveness Test...";
  instruction.innerText = "Turn your face slightly to the LEFT";

  requestAnimationFrame(livenessLoop);
}

async function livenessLoop() {
  if (currentPhase !== 'FACE_LIVENESS') return;

  const detection = await faceapi.detectSingleFace(video, detectorOptions)
                             .withFaceLandmarks(true)
                             .withFaceDescriptor();

  if (detection) {
    const noseX = detection.landmarks.getNose()[3].x;
    const jaw = detection.landmarks.getJawOutline();
    const width = jaw[16].x - jaw[0].x;
    const ratio = (noseX - jaw[0].x) / width;

    // Head turn to left threshold
    if (ratio < 0.38) {
      // Save face descriptor array
      verificationPayload.liveFaceDescriptor = Array.from(detection.descriptor);
      
      badge.innerText = "✓ Liveness Passed";
      badge.className = "status-badge success";
      transitionToIDPhase();
      return;
    }
  }

  trackingLoopId = requestAnimationFrame(livenessLoop);
}

// 4. TRANSITION TO PHASE 2: ID Snapshot Scanning
function transitionToIDPhase() {
  currentPhase = 'ID_SCAN';
  
  // Un-mirror video feed so text on the ID card is readable
  video.classList.add('unmirrored');

  stepTitle.innerText = "Step 2: Document Verification";
  instruction.innerText = "Hold your ID Card up to the camera and click Capture";
  captureIdBtn.style.display = "block";
}

// 5. PHASE 2: Capture Snapshot & Run Tesseract OCR
async function captureAndScanID() {
  captureIdBtn.disabled = true;
  badge.innerText = "Scanning ID Text (OCR)...";
  badge.className = "status-badge loading";
  instruction.innerText = "Reading document details...";

  // Draw current webcam frame onto hidden canvas
  const ctx = snapshotCanvas.getContext('2d');
  snapshotCanvas.width = video.videoWidth;
  snapshotCanvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);

  try {
    // Initialize Tesseract Worker
    const worker = await Tesseract.createWorker('eng');
    const ret = await worker.recognize(snapshotCanvas);
    await worker.terminate();

    const text = ret.data.text;
    console.log("Raw OCR Text Output:", text);

    // Regex to extract alphanumeric ID numbers (Adjust length pattern for your region)
    const idMatch = text.match(/[A-Z0-9]{8,14}/g);

    if (idMatch && idMatch.length > 0) {
      const rawID = idMatch[0];
      
      // Hash the extracted ID string using browser Web Crypto SHA-256
      verificationPayload.hashedIDNumber = await sha256(rawID);
      
      badge.innerText = "✓ ID Verified & Hashed";
      badge.className = "status-badge success";
      instruction.innerText = `Captured ID Hash: ${verificationPayload.hashedIDNumber.slice(0, 14)}...`;
      
      completeVerification();
    } else {
      badge.innerText = "❌ No ID Number Detected";
      badge.className = "status-badge error";
      instruction.innerText = "Could not read ID number clearly. Hold closer and retry.";
      captureIdBtn.disabled = false;
    }
  } catch (err) {
    console.error(err);
    badge.innerText = "OCR Processing Error";
    badge.className = "status-badge error";
    captureIdBtn.disabled = false;
  }
}

// 6. Complete Verification Sequence
function completeVerification() {
  currentPhase = 'COMPLETE';
  
  // Stop webcam tracks to save battery
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }

  captureIdBtn.style.display = "none";
  submitBtn.style.display = "block";
}

// Utility: Browser Native SHA-256 Hashing
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Form Submission (Sends compiled payload to backend)
function handleFormSubmit(e) {
  e.preventDefault();

  const finalPayload = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    biometrics: verificationPayload
  };

  console.log("Final payload ready to POST to server:", finalPayload);
  alert(`Registration Ready!\n\nHashed ID: ${finalPayload.biometrics.hashedIDNumber}\nFace Vector Points: ${finalPayload.biometrics.liveFaceDescriptor.length}`);
}

window.addEventListener('DOMContentLoaded', initVerificationEngine);
</script>
</body>
</html>
