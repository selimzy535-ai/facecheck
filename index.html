<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Signup Gate</title>
  <!-- Load face-api.js directly from a CDN -->
  <script defer src="https://jsdelivr.net"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    #video { width: 320px; height: 240px; background: #333; display: block; margin-bottom: 10px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .success { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Create Your Account</h2>
  
  <!-- Signup Form -->
  <form id="signupForm" action="/api/signup" method="POST">
    <div class="form-group">
      <label>Email:</label><br>
      <input type="email" required name="email">
    </div>
    
    <div class="form-group">
      <label>Password:</label><br>
      <input type="password" required name="password">
    </div>

    
    <div class="form-group">
      <label><b>Human Verification:</b> Look at the camera to unlock registration</label>
      <video id="video" autoplay muted playsinline></video>
      <button type="button" id="verifyBtn" onclick="scanFace()">Scan My Face</button>
    </div>

    <p id="statusMessage">Initializing secure human verification module...</p>

    <!-- The actual submit button is locked by default -->
    <button type="submit" id="submitAccountBtn" disabled>Register Account</button>
  </form>

  <script>
    const video = document.getElementById('video');
    const verifyBtn = document.getElementById('verifyBtn');
    const submitBtn = document.getElementById('submitAccountBtn');
    const statusText = document.getElementById('statusMessage');

    // 1. Automatically load models and start the webcam when page loads
    async function setupVerification() {
      try {
        // Replace with your actual paths where you host the face-api weights
        const MODEL_URL = 'https://githubusercontent.com'; 
        
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        
        // Start user webcam stream
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        video.srcObject = stream;
        
        statusText.innerText = "Camera active. Position your face and click 'Scan My Face'.";
      } catch (err) {
        statusText.className = "error";
        statusText.innerText = "Camera access denied or models failed to load.";
        verifyBtn.disabled = true;
      }
    }

    // 2. Scan the face locally on button click
    async function scanFace() {
      statusText.innerText = "Analyzing biometrics locally...";
      verifyBtn.disabled = true;

      // Detect single face in the current video frame
      const detection = await faceapi.detectSingleFace(video);

      if (detection) {
        // High confidence that a human face is looking at the camera
        statusText.className = "success";
        statusText.innerText = `✓ Human verification successful! (Confidence: ${(detection.score * 100).toFixed(0)}%)`;
        
        // UNLOCK the backend submit button
        submitBtn.disabled = false;
        
        // Optional: Turn off the webcam to save battery/privacy
        const stream = video.srcObject;
        stream.getTracks().forEach(track => track.stop());
      } else {
        statusText.className = "error";
        statusText.innerText = "✗ Verification failed. No clear face detected. Try moving to a brighter room.";
        verifyBtn.disabled = false;
      }
    }

    window.onload = setupVerification;
  </script>
</body>
</html>
